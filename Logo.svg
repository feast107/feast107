  <style>
.facet,.ufacet,.stem,.armTop,.armMid,.tick,.cluster,.sheen{transform-box:view-box}
@media (prefers-reduced-motion: no-preference){
.bg{animation:bgIn .6s ease-out both}
.cluster{animation:sway 18s ease-in-out 2.4s infinite}
.facet{animation:facetIn .95s cubic-bezier(.16,.84,.3,1.08) both,glow 7s ease-in-out infinite}
.ufacet{animation:facetIn .95s cubic-bezier(.16,.84,.3,1.08) both,glow 7s ease-in-out infinite}
.stem{animation:stemIn .75s cubic-bezier(.2,.75,.25,1) 1.05s both}
.armTop{animation:armIn .6s cubic-bezier(.2,.75,.25,1) 1.4s both}
.armMid{animation:armIn .55s cubic-bezier(.2,.75,.25,1) 1.6s both}
.tick{animation:tickIn .5s cubic-bezier(.2,.9,.3,1.45) 1.85s both,pulse 2.8s ease-in-out 3s infinite}
.sheen{opacity:0;animation:sheen 3.8s linear 3.4s infinite}
}
@keyframes bgIn{from{opacity:0}}
@keyframes facetIn{from{opacity:0;transform:scale(.45)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.1deg)}}
@keyframes stemIn{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes armIn{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes tickIn{from{opacity:0;transform:scale(0) rotate(-45deg)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes sheen{0%{opacity:0;transform:translate(-62.3px,-127.4px)}10%{opacity:.7}55%{opacity:.7}100%{opacity:0;transform:translate(353.8px,723.8px)}}
  </style>
